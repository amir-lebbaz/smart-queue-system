<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nextdz-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#313c45" />
      <stop offset="100%" stop-color="#232b32" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect width="512" height="512" rx="116" fill="url(#nextdz-bg)" />
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="#b3bfcb" stroke-width="4" stroke-opacity="0.3" />

  <!-- Center Scaled Ticket Logo -->
  <g transform="translate(64, 130) scale(6)" filter="url(#shadow)">
    <!-- Ticket Body in crisp Pale Snow (#eef1f5) -->
    <path
      d="M4 4H60V14C56.686 14 54 16.686 54 20C54 23.314 56.686 26 60 26V36H4V26C7.314 26 10 23.314 10 20C10 16.686 7.314 14 4 14V4Z"
      stroke="#f7f9fb"
      stroke-width="3"
      stroke-linejoin="round"
      fill="#eef1f5"
    />
    <!-- Forward Indicator Arrow in Icy Blue (#778ca4) -->
    <path
      d="M16 12H36L45 20L36 28H16L22 20L16 12Z"
      fill="#778ca4"
      fill-opacity="0.45"
    />
    <!-- Direction Arrow in Charcoal Mist (#313c45) -->
    <path
      d="M18 20H40M40 20L32 12.5M40 20L32 27.5"
      stroke="#313c45"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Wordmark "NextDZ" at the bottom of the App Icon -->
  <g transform="translate(256, 436)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="1">
      <tspan fill="#f7f9fb">Next</tspan><tspan fill="#b3bfcb">DZ</tspan>
    </text>
  </g>
</svg>
